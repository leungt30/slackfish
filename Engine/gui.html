<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlackFish</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.base.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.brown.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.2.1/assets/chessground.cburnett.css">
<style>
  :root {
    --bg: #f4f1ec; --panel: #ffffff; --text: #26231f; --muted: #6f6a62;
    --border: #ddd6cb; --accent: #7a5c3a; --accent-text: #fff;
    --bar-white: #f7f5f1; --bar-black: #3a3631; --low: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1b19; --panel: #282522; --text: #ece7df; --muted: #a39d93;
      --border: #3d3934; --accent: #c49a6c; --accent-text: #1d1b19;
      --bar-white: #e9e5de; --bar-black: #45403a; --low: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    display: flex; gap: 20px; justify-content: center; align-items: flex-start;
    padding: 20px 16px; flex-wrap: wrap;
  }
  .board-wrap { display: flex; flex-direction: column; gap: 8px; }
  .board-col { display: flex; gap: 10px; order: 1; }
  #board { width: min(calc(100vh - 190px), calc(100vw - 64px)); height: min(calc(100vh - 190px), calc(100vw - 64px)); }
  .evalbar {
    width: 18px; border-radius: 4px; overflow: hidden; position: relative;
    background: var(--bar-black); border: 1px solid var(--border);
  }
  .evalbar .white { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bar-white); transition: height .3s; }
  .evalbar.flipped .white { bottom: auto; top: 0; }
  .panel {
    width: 300px; max-width: 100%; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-size: 20px; margin: 0; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  input[type=number] {
    width: 100%; font: inherit; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  /* Clocks sit above and below the board (the bot's at the top unless flipped) */
  .clock {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin-left: 28px;   /* line up with the board, past the eval bar */
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel);
    height: 60px;   /* fixed, so a clock's contents never shift the board */
    transition: background .15s, border-color .15s;
  }
  .clock .label { min-width: 0; }
  .clock .who { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clock .sub { font-size: 12px; color: var(--muted); min-height: 1.3em; font-variant-numeric: tabular-nums; }
  .clock .time {
    font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .5px;
    line-height: 1.15; padding: 0 10px; border-radius: 6px;
  }
  .clock.running { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .clock.running .time { background: var(--accent); color: var(--accent-text); }
  .clock.untimed .time, .clock.untimed.running .time { color: var(--muted); background: none; font-size: 20px; font-weight: 500; }
  .clock.low .time { color: var(--low); }
  .clock.low.running .time { background: var(--low); color: #fff; }
  .clock.flagged .time { color: var(--low); }
  @media (max-width: 600px) { .clock .time { font-size: 28px; } }
  select, button {
    width: 100%; font: inherit; padding: 7px 9px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  fieldset.botcfg {
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px 10px; margin: 0;
    display: flex; flex-direction: column; gap: 8px;
  }
  fieldset.botcfg legend { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 4px; }
  #status { font-weight: 600; min-height: 1.4em; }
  #evaltext { color: var(--muted); font-variant-numeric: tabular-nums; }
  #moves {
    height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font-variant-numeric: tabular-nums; background: var(--bg);
  }
  #moves .m { display: grid; grid-template-columns: 36px 1fr 1fr; padding: 1px 0; }
  #moves .t { color: var(--muted); font-size: 11px; margin-left: 5px; }
  #moves .n { color: var(--muted); }
  #promo {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none;
    align-items: center; justify-content: center; z-index: 10;
  }
  #promo .box { background: var(--panel); padding: 14px; border-radius: 10px; display: flex; gap: 8px; }
  /* Chessground's base CSS sets pointer-events: none on .cg-wrap pieces; re-enable them in the picker */
  #promo piece { position: static; display: block; width: 64px; height: 64px; cursor: pointer; border-radius: 6px; pointer-events: auto; }
  #promo piece:hover { background-color: var(--border); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: s 0.8s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <div class="board-wrap">
    <div class="clock" id="clock-bot" hidden>
      <div class="label"><div class="who">Bot</div><div class="sub"></div></div>
      <span class="time">5:00</span>
    </div>
    <div class="board-col">
      <div class="evalbar" id="evalbar"><div class="white" id="evalwhite" style="height:50%"></div></div>
      <div id="board" class="cg-wrap"></div>
    </div>
    <div class="clock" id="clock-you" hidden>
      <div class="label"><div class="who">You</div><div class="sub"></div></div>
      <span class="time">5:00</span>
    </div>
  </div>

  <div class="panel">
    <h1>SlackFish</h1>
    <div>
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="white">Play as White</option>
        <option value="black">Play as Black</option>
        <option value="watch">Watch bot vs bot</option>
      </select>
    </div>
    <fieldset class="botcfg" id="cfgA"><legend id="legendA">Bot</legend>
      <div class="row">
        <div><label for="botA">Model</label><select id="botA" class="bot"></select></div>
        <div><label for="depthA">Depth</label><select id="depthA" class="depth"></select></div>
      </div>
      <div class="row">
        <div><label for="qA" title="Extra plies of captures (and check escapes) searched past the depth limit, so the bot doesn't stop in the middle of an exchange. Off = score positions where the search ends.">Quiescence (plies)</label>
          <select id="qA" class="quiescence"></select></div>
        <div><label for="tempA" title="0 always plays the best move. Higher values sample weaker moves more often: at 50, a move 50 centipawns worse is 0.37x as likely.">Temperature (cp)</label>
          <input type="number" id="tempA" min="0" max="1000" step="10" value="0"></div>
      </div>
    </fieldset>
    <fieldset class="botcfg" id="cfgB" hidden><legend>Black bot</legend>
      <div class="row">
        <div><label for="botB">Model</label><select id="botB" class="bot"></select></div>
        <div><label for="depthB">Depth</label><select id="depthB" class="depth"></select></div>
      </div>
      <div class="row">
        <div><label for="qB">Quiescence (plies)</label><select id="qB" class="quiescence"></select></div>
        <div><label for="tempB">Temperature (cp)</label>
          <input type="number" id="tempB" min="0" max="1000" step="10" value="0"></div>
      </div>
    </fieldset>
    <div class="row">
      <div><label for="book" title="Bots play moves from this Polyglot book, sampled by how often each was played, until the game leaves the book. Then they search as usual.">Opening book</label>
        <select id="book"></select></div>
    </div>
    <div class="row" id="tcrow">
      <div><label for="tc" title="Your time control. Running out loses.">Your clock</label>
        <select id="tc">
          <option value="none">No clock</option>
          <option value="1+0">1 + 0 (bullet)</option>
          <option value="2+1">2 + 1 (bullet)</option>
          <option value="3+0">3 + 0 (blitz)</option>
          <option value="3+2">3 + 2 (blitz)</option>
          <option value="5+0">5 + 0 (blitz)</option>
          <option value="5+3">5 + 3 (blitz)</option>
          <option value="10+0">10 + 0 (rapid)</option>
          <option value="10+5">10 + 5 (rapid)</option>
          <option value="15+10">15 + 10 (rapid)</option>
          <option value="30+0">30 + 0 (classical)</option>
          <option value="custom">Custom…</option>
        </select></div>
      <div><label for="btc" title="The bot's time for the whole game, in seconds. With a clock the bot searches as deep as its time allows, spending about 1/25 of what's left per move. Thinking on your time is free, and if it already searched your move to Depth while you thought, it replies instantly without using its clock.">Bot clock</label>
        <select id="btc">
          <option value="none">No clock (fixed depth)</option>
          <option value="5+0">5 s</option>
          <option value="10+0">10 s</option>
          <option value="30+0">30 s</option>
          <option value="60+0">1 min</option>
          <option value="180+0">3 min</option>
          <option value="300+0">5 min</option>
          <option value="10+1">10 s + 1</option>
          <option value="custom">Custom…</option>
        </select></div>
    </div>
    <div class="row" id="tccustom" hidden>
      <div><label for="tcmin">Your minutes</label><input type="number" id="tcmin" min="0.25" max="180" step="0.25" value="5"></div>
      <div><label for="tcinc">Increment (s)</label><input type="number" id="tcinc" min="0" max="300" step="1" value="0"></div>
    </div>
    <div class="row" id="btccustom" hidden>
      <div><label for="btcsec">Bot seconds</label><input type="number" id="btcsec" min="1" max="10800" step="1" value="10"></div>
      <div><label for="btcinc">Increment (s)</label><input type="number" id="btcinc" min="0" max="300" step="0.5" value="0"></div>
    </div>
    <div class="row" id="delayrow" hidden>
      <div><label for="delay">Time per move (at least)</label>
        <select id="delay">
          <option value="0">As fast as possible</option>
          <option value="0.5">0.5 s</option>
          <option value="1">1 s</option>
          <option value="2">2 s</option>
          <option value="3">3 s</option>
        </select></div>
    </div>
    <button class="primary" id="new">New game</button>
    <div>
      <div id="status"></div>
      <div id="evaltext"></div>
    </div>
    <div id="moves"></div>
    <div class="row">
      <button id="undo">Undo</button>
      <button id="pause" hidden>Pause</button>
      <button id="flip">Flip</button>
      <button id="pgn">PGN</button>
    </div>
    <div class="row" id="export" hidden>
      <button id="gif">Save GIF</button>
      <button id="png">Save PNG</button>
    </div>
  </div>
</main>

<div id="promo"><div class="box cg-wrap" id="promobox"></div></div>

<script type="module">
import { Chessground } from "https://cdn.jsdelivr.net/npm/chessground@9.2.1/+esm";

const $ = (id) => document.getElementById(id);
let state = null, busy = false, orientation = "white";

for (const sel of document.querySelectorAll("select.depth"))
  sel.innerHTML = [1, 2, 3, 4, 5].map((d) => `<option>${d}</option>`).join("");
for (const sel of document.querySelectorAll("select.quiescence"))
  sel.innerHTML = [[0, "Off"], [2, "2"], [4, "4"], [6, "6 (default)"], [8, "8"], [12, "12"]]
    .map(([v, t]) => `<option value="${v}">${t}</option>`).join("");
for (const sel of document.querySelectorAll("select.quiescence")) sel.value = "6";

// Bot settings: "A" is the single bot (play modes) or White's bot (watch), "B" is Black's bot
function readBot(k) {
  return { name: $("bot" + k).value, depth: $("depth" + k).value,
           quiescence: $("q" + k).value, temperature: $("temp" + k).value || 0 };
}
function writeBot(k, spec) {
  if (!spec) return;
  $("bot" + k).value = spec.name; $("depth" + k).value = String(spec.depth);
  $("q" + k).value = String(spec.quiescence); $("temp" + k).value = spec.temperature;
}
function updateModeUI() {
  const watch = $("mode").value === "watch";
  $("legendA").textContent = watch ? "White bot" : "Bot";
  $("cfgB").hidden = !watch;
  $("tcrow").hidden = watch;
  $("tccustom").hidden = watch || $("tc").value !== "custom";
  $("btccustom").hidden = watch || $("btc").value !== "custom";
  $("delayrow").hidden = !watch;
}
$("mode").onchange = updateModeUI;
const label = (spec, color) => `${spec.name} (${color})`;

const cg = Chessground($("board"), {
  coordinates: true,
  animation: { duration: 200 },
  premovable: { enabled: false },
  movable: { free: false, showDests: true, events: { after: onUserMove } },
  highlight: { lastMove: true, check: true },
});
// Chessground caches the board's screen position and only re-measures on scroll
// or window resize. The clocks above the board can appear, hide or swap and move
// it, which would make clicks land a rank off. So have it re-measure (its scroll
// handler clears the cache) right before each press, ahead of its own handler.
for (const ev of ["mousedown", "touchstart"])
  $("board").addEventListener(ev, () => document.dispatchEvent(new Event("scroll")), { capture: true, passive: true });

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function render(s) {
  state = s;
  const thinking = s.thinking;
  const humanTurn = !s.gameOver && s.turn === s.humanColor && !thinking;
  cg.set({
    fen: s.fen,
    orientation,
    turnColor: s.turn,
    lastMove: s.lastMove || undefined,
    check: s.check ? s.turn : false,
    movable: { color: humanTurn ? s.humanColor : undefined, dests: new Map(Object.entries(s.dests)) },
  });

  const watching = s.humanColor === null;
  $("undo").hidden = watching;
  $("undo").disabled = thinking || s.history.length === 0 || s.flagged;
  $("pause").hidden = !watching;
  $("pause").disabled = s.gameOver;
  $("pause").textContent = s.paused ? "Resume" : "Pause";
  renderClock();
  $("export").hidden = !s.gameOver;

  // Status
  let status;
  const botSpec = s.white || s.black;   // play modes: the one bot
  if (s.gameOver) {
    const winner = s.result === "1-0" ? "white" : "black";
    if (s.result === "1/2-1/2") status = `Draw (${s.reason})`;
    else if (watching) status = `${label(s[winner], winner === "white" ? "White" : "Black")} wins by ${s.reason}`;
    else status = `${winner === s.humanColor ? "You win" : `${botSpec.name} wins`} by ${s.reason}`;
  } else if (thinking) {
    status = `<span class="spin"></span>${watching ? label(s[s.turn], s.turn === "white" ? "White" : "Black") : s.thinkingBot} is thinking…`
      + (s.thinkLeft !== null && s.thinkLeft !== undefined ? ` <span id="thinkleft" style="color: var(--muted)"></span>` : "");
  } else if (watching && s.paused) {
    status = "Paused";
  } else {
    status = s.turn === s.humanColor ? "Your move" + (s.check ? " (check)" : "")
      + (s.pondering ? ` <span style="color: var(--muted)">· ${botSpec.name} is thinking on your time</span>` : "") : "";
  }
  $("status").innerHTML = status;
  renderThinkLeft();

  // Eval (White's perspective, centipawns)
  if (s.evalBook) {
    $("evaltext").textContent = `${s.evalBy}: book move`;
    if (s.eval === null) $("evalwhite").style.height = "50%";
  } else if (s.eval === null) {
    $("evaltext").textContent = "";
    $("evalwhite").style.height = "50%";
  } else {
    const mate = Math.abs(s.eval) > 90000;
    $("evaltext").textContent = `${s.evalBy} eval: ` + (mate
      ? (s.eval > 0 ? "White mates" : "Black mates")
      : `${s.eval >= 0 ? "+" : ""}${(s.eval / 100).toFixed(2)}`)
      + (s.evalDepth ? ` (depth ${s.evalDepth})` : "");
    const pct = 100 / (1 + Math.exp(-s.eval / 400));
    $("evalwhite").style.height = `${Math.max(3, Math.min(97, pct))}%`;
  }
  $("evalbar").classList.toggle("flipped", orientation === "black");

  // Move list
  // Each move shows the time spent on it: thinking time for bots, turn time for the human
  const fmtTime = (t) => t === null || t === undefined ? ""
    : t < 10 ? `${t.toFixed(1)}s` : t < 60 ? `${Math.round(t)}s` : `${Math.floor(t / 60)}:${String(Math.round(t % 60)).padStart(2, "0")}`;
  const cell = (i) => i < s.history.length
    ? `<span>${s.history[i]}<span class="t">${fmtTime(s.times && s.times[i])}</span></span>` : "<span></span>";
  let html = "";
  for (let i = 0; i < s.history.length; i += 2) {
    html += `<div class="m"><span class="n">${i / 2 + 1}.</span>${cell(i)}${cell(i + 1)}</div>`;
  }
  $("moves").innerHTML = html;
  $("moves").scrollTop = $("moves").scrollHeight;
}

function syncControls(s) {
  for (const sel of document.querySelectorAll("select.bot"))
    sel.innerHTML = s.bots.map((b) => `<option>${b}</option>`).join("");
  $("mode").value = s.humanColor || "watch";
  if (s.humanColor === null) { writeBot("A", s.white); writeBot("B", s.black); }
  else { writeBot("A", s.white || s.black); writeBot("B", s.white || s.black); }
  if (s.humanColor === null) $("delay").value = String(s.delay);
  $("book").innerHTML = `<option value="">Off</option>` + (s.books || []).map((b) => `<option>${b}</option>`).join("");
  $("book").value = s.book || "";
  // Show the current game's time controls in the settings
  if (s.humanColor) {
    const controls = s.clock ? s.clock.controls : {};
    const you = controls[s.humanColor], bot = controls[s.humanColor === "white" ? "black" : "white"];
    const tc = you ? `${+(you.base / 60).toFixed(2)}+${+you.increment.toFixed(2)}` : "none";
    $("tc").value = [...$("tc").options].some((o) => o.value === tc) ? tc : "custom";
    if ($("tc").value === "custom") { $("tcmin").value = +(you.base / 60).toFixed(2); $("tcinc").value = you.increment; }
    const btc = bot ? `${+bot.base.toFixed(2)}+${+bot.increment.toFixed(2)}` : "none";
    $("btc").value = [...$("btc").options].some((o) => o.value === btc) ? btc : "custom";
    if ($("btc").value === "custom") { $("btcsec").value = +bot.base.toFixed(2); $("btcinc").value = bot.increment; }
  }
  updateModeUI();
}

// --- Clock: the server owns the time; this just counts down between updates ---
let clockAt = 0;   // performance.now() when the last state arrived
function syncClock(s) {
  clockAt = performance.now();
}
function formatClock(t) {
  if (t < 10) return t.toFixed(1);
  const total = Math.ceil(t), h = Math.floor(total / 3600), m = Math.floor(total / 60) % 60, sec = total % 60;
  const ss = String(sec).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
}
function renderClock() {
  // Shown when either side has a clock; an untimed side shows "No clock" so both stay visible
  const c = state && state.humanColor && state.clock;
  const youAtBottom = !state || orientation === (state.humanColor || "white");
  for (const who of ["bot", "you"]) {
    const el = $("clock-" + who);
    el.hidden = !c;
    if (!c) continue;
    el.style.order = (who === "you") === youAtBottom ? 2 : 0;   // below / above the board
    const color = who === "you" ? state.humanColor : state.humanColor === "white" ? "black" : "white";
    const control = c.controls[color];   // null: that side is untimed
    const running = c.running === color;
    const thinking = who === "bot" && state.thinking;
    el.querySelector(".who").textContent = who === "you" ? "You" : (state.white || state.black).name;
    const sub = el.querySelector(".sub");
    el.classList.toggle("untimed", !control);
    el.classList.toggle("running", running || (!control && (thinking || (who === "you" && state.turn === color && !state.gameOver))));
    if (!control) {
      el.querySelector(".time").textContent = "No clock";
      sub.textContent = thinking ? "Thinking…" : el.classList.contains("running") ? "Your move" : "";
      el.classList.remove("low", "flagged");
      continue;
    }
    const t = Math.max(0, c[color] - (running ? (performance.now() - clockAt) / 1000 : 0));
    el.querySelector(".time").textContent = formatClock(t);
    const moved = state.history.filter((m, i) => m !== "…" && (i % 2 === 0) === (color === "white")).length > 0;
    const inc = control.increment ? `+${+control.increment.toFixed(2)}s per move` : "";
    if (thinking && state.thinkLeft !== null && state.thinkLeft !== undefined) {
      const left = Math.max(0, state.thinkLeft - (performance.now() - clockAt) / 1000);
      sub.textContent = `Thinking · ${left.toFixed(1)}s for this move`;
    } else if (!moved && !state.gameOver) {
      sub.textContent = "Starts after first move";
    } else if (who === "bot" && state.pondering) {
      sub.textContent = "Thinking on your time (free)" + (inc ? ` · ${inc}` : "");
    } else {
      sub.textContent = inc;
    }
    el.classList.toggle("low", t > 0 && t < Math.min(10, control.base * 0.2));
    el.classList.toggle("flagged", state.flagged && t <= 0);
  }
}
setInterval(() => { if (state && state.clock && (state.clock.running || state.thinking)) renderClock(); }, 100);
// A timed bot's budget for this move, counting down like the clock
function renderThinkLeft() {
  const el = $("thinkleft");
  if (el && state && state.thinkLeft !== null)
    el.textContent = `· ${Math.max(0, state.thinkLeft - (performance.now() - clockAt) / 1000).toFixed(1)}s for this move`;
}
setInterval(renderThinkLeft, 100);
$("tc").onchange = updateModeUI;
$("btc").onchange = updateModeUI;
function clockSetting() {
  const v = $("tc").value;
  return v === "custom" ? `${$("tcmin").value}+${$("tcinc").value || 0}` : v;
}
function botClockSetting() {
  const v = $("btc").value;
  return v === "custom" ? `${$("btcsec").value}+${$("btcinc").value || 0}` : v;
}

// Apply a state from the server (POST response or the live event stream).
// The server runs the bot itself, so every viewer just renders what it sends.
let pending = null;
function update(s) {
  if (state && s.version < state.version) return;            // older than what we're showing
  if ($("promo").style.display === "flex") { pending = s; return; }   // don't yank the board mid-promotion
  pending = null;
  const first = state === null;
  if (first || s.humanColor !== state.humanColor) orientation = s.humanColor || "white";
  const settings = (x) => JSON.stringify([x.white, x.black, x.humanColor, x.delay, x.book,
                                          x.clock && x.clock.controls]);
  if (first || settings(s) !== settings(state)) syncControls(s);
  syncClock(s);
  render(s);
}

// Resolves to "q" / "r" / "b" / "n", or null if dismissed (click outside or Escape)
function askPromotion(color) {
  return new Promise((resolve) => {
    const overlay = $("promo"), box = $("promobox");
    const finish = (letter) => {
      overlay.style.display = "none";
      overlay.onclick = null;
      document.removeEventListener("keydown", onKey);
      resolve(letter);
    };
    const onKey = (e) => { if (e.key === "Escape") finish(null); };

    box.innerHTML = "";
    for (const [role, letter] of [["queen", "q"], ["rook", "r"], ["bishop", "b"], ["knight", "n"]]) {
      const p = document.createElement("piece");
      p.className = `${color} ${role}`;
      p.title = role;
      p.onclick = (e) => { e.stopPropagation(); finish(letter); };
      box.appendChild(p);
    }
    overlay.onclick = () => finish(null);
    document.addEventListener("keydown", onKey);
    overlay.style.display = "flex";
  });
}

async function onUserMove(orig, dest) {
  let uci = orig + dest;
  const piece = cg.state.pieces.get(dest);
  if (piece && piece.role === "pawn" && (dest[1] === "8" || dest[1] === "1")) {
    const letter = await askPromotion(piece.color);
    if (!letter) { update(pending || state); return; }   // cancelled: put the pawn back
    uci += letter;
  }
  try { update(await api("/api/move", { uci })); }
  catch (e) { update(await api("/api/state")); }   // rejected: show the real position
}

$("new").onclick = async () => {
  if (busy) return;
  busy = true;
  const mode = $("mode").value;
  orientation = mode === "watch" ? "white" : mode;
  const book = $("book").value || null;
  const body = mode === "watch" ? { white: readBot("A"), black: readBot("B"), delay: $("delay").value }
             : mode === "white" ? { white: null, black: readBot("A"), clock: clockSetting(), botClock: botClockSetting() }
             : { white: readBot("A"), black: null, clock: clockSetting(), botClock: botClockSetting() };
  $("status").innerHTML = `<span class="spin"></span>Loading…`;
  try {
    update(await api("/api/new", { ...body, book }));
  } catch (e) { $("status").textContent = "Error: " + e.message; }
  finally { busy = false; }
};
$("undo").onclick = async () => {
  try { update(await api("/api/undo", {})); } catch (e) { update(await api("/api/state")); }
};
$("pause").onclick = async () => {
  try { update(await api("/api/pause", { paused: !state.paused })); } catch (e) { update(await api("/api/state")); }
};
$("flip").onclick = () => { orientation = orientation === "white" ? "black" : "white"; render(state); };
async function download(path, filename, button) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = "Rendering…";
  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error(res.statusText);
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await res.blob());
    a.download = filename;
    a.click();
  } catch (e) {
    $("status").textContent = "Export failed: " + e.message;
  } finally {
    button.disabled = false;
    button.textContent = label;
  }
}
$("pgn").onclick = () => download("/api/pgn", "slackfish.pgn", $("pgn"));
$("gif").onclick = () => download("/api/export.gif", "slackfish.gif", $("gif"));
$("png").onclick = () => download("/api/export.png", "slackfish.png", $("png"));

update(await api("/api/state"));

// Live updates: the server pushes the new state whenever anyone (in any tab or
// through a tunnel like ngrok) moves, undoes, starts a game, or the bot replies.
// EventSource reconnects by itself if the connection drops.
const events = new EventSource("/api/events");
events.onmessage = (e) => update(JSON.parse(e.data));
</script>
</body>
</html>
